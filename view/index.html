<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网址管家 · LinkVault</title>
<style>
  :root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --border:#e6e9ef;
    --text:#1f2933;
    --text-muted:#6b7280;
    --primary:#3b5bdb;
    --primary-hover:#2b4acb;
    --primary-soft:#eef1fd;
    --danger:#e03131;
    --danger-soft:#fdeaea;
    --star:#f59f00;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 30px rgba(0,0,0,.12);
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ====== Layout ====== */
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .app{display:none} /* legacy */

  /* Top header bar */
  .app-header{
    background:var(--card);border-bottom:1px solid var(--border);
    padding:0 24px 0 0;display:flex;align-items:center;gap:0;height:52px;flex-shrink:0;
  }
  .app-header .brand{
    display:flex;align-items:center;gap:10px;
    width:240px;flex-shrink:0;height:100%;
    border-right:1px solid var(--border);
    padding:0 24px;
  }
  .brand-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .app-header .brand-logo{
    width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,#3b5bdb,#7048e8);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .app-header .brand-name{font-size:16px;font-weight:700}
  .app-header .brand-sub{font-size:11px;color:var(--text-muted)}

  /* Notice ticker */
  .notice-bar{
    flex:1;min-width:0;height:100%;display:flex;align-items:center;
    overflow:hidden;position:relative;
    padding-left:14px;
  }
  .notice-track{
    display:flex;align-items:center;white-space:nowrap;
    animation:notice-scroll 22s linear infinite;will-change:transform;
  }
  .notice-bar:hover .notice-track{animation-play-state:paused}
  .notice-track span{
    font-size:13px;font-weight:500;color:var(--danger);padding-right:64px;
    display:flex;align-items:center;gap:6px;
  }
  .notice-track span::before{
    content:"⚠";font-size:14px;
  }
  @keyframes notice-scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  .menu-toggle{
    display:none;width:38px;height:38px;margin-right:4px;flex-shrink:0;
    border:none;background:transparent;cursor:pointer;border-radius:8px;
    color:var(--text);align-items:center;justify-content:center;
  }
  .menu-toggle:active{background:var(--bg)}

  .body-wrap{display:flex;flex:1;overflow:hidden}

  /* Sidebar */
  .sidebar{
    width:240px;background:var(--card);border-right:1px solid var(--border);
    padding:12px 0;flex-shrink:0;height:100%;overflow-y:auto;
  }
  .sidebar-overlay{display:none}

  .nav-section{padding:8px 12px}
  .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-muted);padding:8px 8px 4px;font-weight:600;
  }
  .nav-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;
    font-size:14px;color:var(--text);transition:.15s;margin-bottom:2px;
  }
  .nav-item:hover{background:var(--primary-soft)}
  .nav-item.active{background:var(--primary);color:#fff}
  .nav-item.active .nav-count{background:rgba(255,255,255,.25);color:#fff}
  .nav-count{
    font-size:11px;background:var(--bg);padding:1px 7px;border-radius:10px;color:var(--text-muted);
  }
  .nav-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

  .search{
    flex:1;max-width:420px;position:relative;
  }
  .search input{
    width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);
    border-radius:var(--radius-sm);font-size:14px;background:var(--bg);transition:.15s;
  }
  .search input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
    cursor:pointer;border:none;transition:.15s;white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-ghost{background:transparent;color:var(--text-muted)}
  .btn-ghost:hover{background:var(--bg);color:var(--text)}
  .btn-outline{background:var(--card);border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
  .btn-danger{background:var(--danger-soft);color:var(--danger)}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .btn-sm{padding:5px 10px;font-size:13px}

  /* Content */
  .content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
  .content-sticky{
    position:sticky;top:0;z-index:10;
    padding:20px 24px 14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:rgba(245,247,250,.8);
  }
  .content-header{padding-bottom:8px}
  .content-title{font-size:20px;font-weight:700;line-height:1.35}
  .content-meta{font-size:13px;color:var(--text-muted);line-height:1.35}
  .header-add-btn{display:none}

  /* Content toolbar */
  .content-toolbar{
    display:flex;align-items:center;gap:14px;
  }

  /* Grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;
    padding:12px 24px 24px;
  }

  /* Card */
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;transition:.18s;position:relative;display:flex;flex-direction:column;
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:transparent}
  .card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
  .favicon{
    width:36px;height:36px;border-radius:8px;flex-shrink:0;
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    overflow:hidden;border:1px solid var(--border);
  }
  .favicon img{width:22px;height:22px}
  .favicon-fallback{font-size:16px;font-weight:700;color:var(--primary)}
  .card-info{flex:1;min-width:0}
  .card-name{
    font-size:15px;font-weight:600;margin-bottom:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-url{
    font-size:12px;color:var(--text-muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card-url a{color:var(--primary);text-decoration:none}
  .card-url a:hover{text-decoration:underline}

  .star-btn{
    background:none;border:none;cursor:pointer;font-size:24px;
    color:var(--text-muted);padding:2px;line-height:1;transition:.15s;
  }
  .star-btn:hover{transform:scale(1.2)}
  .star-btn.active{color:var(--star)}

  .card-desc{
    font-size:13px;color:var(--text-muted);margin-bottom:10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--text-muted);
  }
  .type-badge{
    font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;
  }

  .card-foot{
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    margin-top:auto;padding-top:10px;border-top:1px dashed var(--border);
  }
  .card-time{font-size:11px;color:var(--text-muted)}
  .card-actions{display:flex;gap:4px}
  .icon-btn{
    width:28px;height:28px;border:none;background:transparent;cursor:pointer;
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);transition:.15s;
  }
  .icon-btn:hover{background:var(--bg);color:var(--text)}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}

  .text-btn{
    height:28px;padding:0 8px;border:none;background:transparent;
    color:var(--text-muted);cursor:pointer;border-radius:6px;font-size:12px;
    font-family:inherit;line-height:1;transition:.15s;
  }
  .text-btn:hover{color:var(--primary);background:var(--primary-soft)}
  .text-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}

  /* Empty */
  .empty{
    text-align:center;padding:60px 20px;color:var(--text-muted);
  }
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
  .empty h3{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:600}
  .empty p{font-size:14px;margin-bottom:16px}

  /* Modal */
  .modal-mask{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:none;align-items:center;justify-content:center;z-index:100;
    backdrop-filter:blur(2px);
  }
  .modal-mask.show{display:flex}
  .modal{
    background:var(--card);border-radius:14px;width:min(560px,92vw);
    max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{
    padding:18px 22px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;
  }
  .modal-title{font-size:17px;font-weight:700}
  .modal-close{
    width:30px;height:30px;border:none;background:transparent;cursor:pointer;
    font-size:20px;color:var(--text-muted);border-radius:6px;
  }
  .modal-close:hover{background:var(--bg)}
  .modal-body{padding:20px 22px}
  .modal-foot{
    padding:14px 22px;border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--card);
  }

  /* Form */
  .form-row{margin-bottom:14px}
  .form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-label{
    display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--text);
  }
  .form-label .req{color:var(--danger)}
  .form-control{
    width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:var(--card);color:var(--text);transition:.15s;
  }
  .form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  textarea.form-control{resize:vertical;min-height:70px}
  select.form-control{cursor:pointer}

  .type-picker{display:flex;flex-wrap:wrap;gap:6px}
  .type-opt{
    padding:5px 11px;border-radius:14px;border:1px solid var(--border);
    font-size:13px;cursor:pointer;transition:.15s;background:var(--card);
  }
  .type-opt:hover{border-color:var(--primary)}
  .type-opt.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1f2933;color:#fff;padding:10px 18px;border-radius:8px;
    font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;
    box-shadow:var(--shadow-lg);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Type colors */
  .t-website{background:#e7f5ff;color:#1971c2}
  .t-api{background:#f3f0ff;color:#6741d9}
  .t-server{background:#fff4e6;color:#d9480f}
  .t-database{background:#e6fcf5;color:#0c8599}
  .t-tool{background:#fff0f6;color:#c2255c}
  .t-other{background:#f1f3f5;color:#495057}

  /* ====== Responsive / Mobile ====== */
  @media(max-width:768px){
    .menu-toggle{display:flex}

    /* Sidebar becomes a slide-in drawer */
    .sidebar{
      position:fixed;top:52px;left:0;bottom:0;z-index:60;
      width:80%;max-width:300px;height:auto;
      transform:translateX(-100%);transition:transform .25s ease;
      box-shadow:var(--shadow-lg);
    }
    .sidebar.open{transform:translateX(0)}
    .sidebar-overlay{
      display:block;position:fixed;inset:52px 0 0 0;z-index:55;
      background:rgba(15,23,42,.4);opacity:0;visibility:hidden;transition:.25s;
    }
    .sidebar-overlay.show{opacity:1;visibility:visible}

    .app-header{padding:0 12px;gap:10px}
    .app-header .brand-sub{display:none}
    .app-header .brand{width:auto;flex:1;border-right:none;padding:0}
    .notice-bar{padding-left:8px}
    .notice-track span{font-size:12px;padding-right:48px}

    /* 新增按钮移到标题右侧 */
    .header-add-btn{display:inline-flex}
    .content-header .header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .content-sticky{padding:14px 16px 12px}
    .content-header{padding-bottom:6px}
    .content-toolbar .btn-add{display:none}

    .content-toolbar{padding:0}
    .search{flex:1 1 100%}

    .grid{padding:10px 16px 16px;grid-template-columns:1fr}
    .card{padding:14px}

    .text-btn{height:34px;padding:0 12px;font-size:13px}
    .card-foot .card-actions{width:100%;justify-content:flex-end;gap:14px;flex-wrap:wrap}

    .form-row.two{grid-template-columns:1fr}
    .modal-body{padding:16px}
    .modal-head{padding:14px 16px}
    .modal-foot{padding:14px 16px;gap:10px;flex-wrap:nowrap}
    .modal-foot .btn{flex:1;justify-content:center}
  }
</style>
</head>
<body>
<div class="app-header">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="打开菜单">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-left">
      <div class="brand-logo">L</div>
      <div>
        <div class="brand-name">MH Exclusive</div>
        <div class="brand-sub">网址管理</div>
      </div>
    </div>
  </div>
  <div class="notice-bar" title="郑重声明">
    <div class="notice-track">
      <span>本站所有数据均存在本地，没有网络请求，没有数据服务器，丢失无法找回。</span>
      <span>本站所有数据均存在本地，没有网络请求，没有数据服务器，丢失无法找回。</span>
    </div>
  </div>
</div>
<div class="body-wrap">
  <!-- ====== Sidebar ====== -->
  <aside class="sidebar">

    <div class="nav-section">
      <div class="nav-title">视图</div>
      <div class="nav-item active" data-filter="all">
        <span><span class="nav-dot" style="background:#868e96"></span>全部地址</span>
        <span class="nav-count" id="count-all">0</span>
      </div>
      <div class="nav-item" data-filter="starred">
        <span><span class="nav-dot" style="background:#f59f00"></span>已收藏</span>
        <span class="nav-count" id="count-starred">0</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-title">分类</div>
      <div class="nav-item" data-filter="website">
        <span><span class="nav-dot" style="background:#1971c2"></span>网站</span>
        <span class="nav-count" id="count-website">0</span>
      </div>
      <div class="nav-item" data-filter="api">
        <span><span class="nav-dot" style="background:#6741d9"></span>API 接口</span>
        <span class="nav-count" id="count-api">0</span>
      </div>
      <div class="nav-item" data-filter="server">
        <span><span class="nav-dot" style="background:#d9480f"></span>服务器</span>
        <span class="nav-count" id="count-server">0</span>
      </div>
      <div class="nav-item" data-filter="database">
        <span><span class="nav-dot" style="background:#0c8599"></span>数据库</span>
        <span class="nav-count" id="count-database">0</span>
      </div>
      <div class="nav-item" data-filter="tool">
        <span><span class="nav-dot" style="background:#c2255c"></span>工具</span>
        <span class="nav-count" id="count-tool">0</span>
      </div>
      <div class="nav-item" data-filter="other">
        <span><span class="nav-dot" style="background:#495057"></span>其他</span>
        <span class="nav-count" id="count-other">0</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-title">数据</div>
      <div class="nav-item" onclick="exportData()">
        <span><span class="nav-dot" style="background:#2f9e44"></span>导出 JSON</span>
      </div>
      <div class="nav-item" onclick="document.getElementById('import-file').click()">
        <span><span class="nav-dot" style="background:#e8590c"></span>导入 JSON</span>
      </div>
      <div class="nav-item" onclick="clearAllData()" style="color:var(--danger)">
        <span><span class="nav-dot" style="background:var(--danger)"></span>清空全部</span>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </aside>

  <!-- ====== Main ====== -->
  <main class="main">
    <div class="content">
      <div class="content-sticky">
        <div class="content-header">
          <div class="header-row">
            <div>
              <div class="content-title" id="view-title">全部地址</div>
              <div class="content-meta" id="view-meta">管理你的网络地址收藏</div>
            </div>
            <button class="btn btn-primary header-add-btn" onclick="openModal()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              添加地址
            </button>
          </div>
        </div>

        <div class="content-toolbar">
          <div class="search">
            <span class="search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="search-input" placeholder="搜索名称、网址或标签...">
          </div>
          <button class="btn btn-primary btn-add" onclick="openModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            添加地址
          </button>
        </div>
      </div>

      <div id="list-container"></div>
    </div>
  </main>
</div>

<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ====== Modal ====== -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">添加地址</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="link-form" onsubmit="return saveLink(event)">
        <input type="hidden" id="link-id">

        <div class="form-row">
          <label class="form-label">名称 <span class="req">*</span></label>
          <input type="text" id="link-name" class="form-control" placeholder="例如：GitHub" required>
        </div>

        <div class="form-row">
          <label class="form-label">网址 <span class="req">*</span></label>
          <input type="text" id="link-url" class="form-control" placeholder="https://github.com" required>
        </div>

        <div class="form-row">
          <label class="form-label">类型</label>
          <div class="type-picker" id="type-picker">
            <span class="type-opt active" data-type="website">网站</span>
            <span class="type-opt" data-type="api">API 接口</span>
            <span class="type-opt" data-type="server">服务器</span>
            <span class="type-opt" data-type="database">数据库</span>
            <span class="type-opt" data-type="tool">工具</span>
            <span class="type-opt" data-type="other">其他</span>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">标签（逗号分隔）</label>
          <input type="text" id="link-tags" class="form-control" placeholder="开发, 文档, 常用">
        </div>

        <div class="form-row two">
          <div>
            <label class="form-label">账号</label>
            <input type="text" id="link-user" class="form-control" placeholder="可选">
          </div>
          <div>
            <label class="form-label">密码</label>
            <input type="text" id="link-pass" class="form-control" placeholder="可选">
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">备注</label>
          <textarea id="link-desc" class="form-control" placeholder="用途、说明、注意事项..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="document.getElementById('link-form').requestSubmit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== State ====== */
const STORAGE_KEY = 'linkvault_data_v1';
let links = [];
let currentFilter = 'all';
let currentSearch = '';
let editingType = 'website';

const TYPE_LABELS = {
  website:'网站', api:'API 接口', server:'服务器', database:'数据库', tool:'工具', other:'其他'
};
const VIEW_TITLES = {
  all:'全部地址', starred:'已收藏',
  website:'网站', api:'API 接口', server:'服务器', database:'数据库', tool:'工具', other:'其他'
};
const VIEW_META = {
  all:'管理你的网络地址收藏', starred:'你标记为重要的地址',
  website:'网页与应用站点', api:'后端接口与端点',
  server:'主机与服务器资源', database:'数据库连接信息',
  tool:'在线工具与服务', other:'其他类型的地址'
};

/* ====== Storage ====== */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    links = raw ? JSON.parse(raw) : [];
  }catch(e){ links = []; }
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
}

/* ====== Helpers ====== */
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeUrl(url){
  url = url.trim();
  if(!url) return '';
  if(!/^https?:\/\//i.test(url) && !/^ftp:\/\//i.test(url)){
    url = 'https://' + url;
  }
  return url;
}
function getDomain(url){
  try{ return new URL(normalizeUrl(url)).hostname; }catch(e){ return url; }
}
function getFaviconUrl(url){
  const domain = getDomain(url);
  return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain) + '&sz=64';
}
function formatDateTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
       + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

/* ====== Render ====== */
function render(){
  const filtered = getFiltered();
  const container = document.getElementById('list-container');

  if(filtered.length === 0){
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <h3>${currentSearch ? '没有匹配的地址' : '还没有地址'}</h3>
        <p>${currentSearch ? '换个关键词试试' : '点击右上角"添加地址"开始管理你的网络资源'}</p>
        <button class="btn btn-primary" onclick="openModal()">+ 添加第一个地址</button>
      </div>`;
  } else {
    container.innerHTML = '<div class="grid">' + filtered.map(renderCard).join('') + '</div>';
  }

  // counts
  updateCounts();
  // view title
  document.getElementById('view-title').textContent = VIEW_TITLES[currentFilter] || '全部地址';
  document.getElementById('view-meta').textContent = VIEW_META[currentFilter] || '';
}

function getFiltered(){
  let arr = links;
  if(currentFilter === 'starred'){
    arr = arr.filter(l=>l.starred);
  } else if(currentFilter !== 'all'){
    arr = arr.filter(l=>l.type === currentFilter);
  }
  if(currentSearch){
    const q = currentSearch.toLowerCase();
    arr = arr.filter(l =>
      (l.name||'').toLowerCase().includes(q) ||
      (l.url||'').toLowerCase().includes(q) ||
      (l.tags||'').toLowerCase().includes(q) ||
      (l.desc||'').toLowerCase().includes(q)
    );
  }
  // starred first, then by time desc
  arr = [...arr].sort((a,b)=>{
    if(a.starred !== b.starred) return b.starred - a.starred;
    return b.updatedAt - a.updatedAt;
  });
  return arr;
}

function renderCard(l){
  const tags = (l.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
  const tagHtml = tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
  const fav = getFaviconUrl(l.url);
  const initial = escapeHtml((l.name||'?').charAt(0).toUpperCase());
  return `
    <div class="card" data-id="${l.id}">
      <div class="card-top">
        <div class="favicon">
          <img src="${fav}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="">
          <span class="favicon-fallback" style="display:none">${initial}</span>
        </div>
        <div class="card-info">
          <div class="card-name">${escapeHtml(l.name)}</div>
          <div class="card-url"><a href="${escapeHtml(normalizeUrl(l.url))}" target="_blank" rel="noopener">${escapeHtml(getDomain(l.url))}</a></div>
        </div>
        <button class="star-btn ${l.starred?'active':''}" onclick="toggleStar('${l.id}')" title="${l.starred?'取消收藏':'收藏'}">
          ${l.starred ? '★' : '☆'}
        </button>
      </div>
      ${l.desc ? `<div class="card-desc">${escapeHtml(l.desc)}</div>` : ''}
      <div class="card-tags">
        <span class="type-badge t-${l.type}">${TYPE_LABELS[l.type]||l.type}</span>
        ${tagHtml}
      </div>
      <div class="card-foot">
        <div class="card-actions">
          <button class="text-btn danger" onclick="deleteLink('${l.id}')" title="删除">删除</button>
          ${l.user||l.pass ? `<button class="text-btn" onclick="copyCreds('${l.id}')" title="复制账号信息">复制账号</button>` : ''}
          <button class="text-btn" onclick="editLink('${l.id}')" title="编辑此地址">编辑</button>
          <button class="text-btn" onclick="copyUrl('${l.id}')" title="复制网址">复制网址</button>
        </div>
        <span class="card-time">${formatDateTime(l.createdAt || l.updatedAt)}</span>
      </div>
    </div>`;
}

function updateCounts(){
  document.getElementById('count-all').textContent = links.length;
  document.getElementById('count-starred').textContent = links.filter(l=>l.starred).length;
  ['website','api','server','database','tool','other'].forEach(t=>{
    document.getElementById('count-'+t).textContent = links.filter(l=>l.type===t).length;
  });
}

/* ====== Filter & Search ====== */
document.querySelectorAll('.nav-item[data-filter]').forEach(item=>{
  item.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item[data-filter]').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    currentFilter = item.dataset.filter;
    render();
  });
});
document.getElementById('search-input').addEventListener('input', e=>{
  currentSearch = e.target.value.trim();
  render();
});

/* ====== Mobile sidebar drawer ====== */
function toggleSidebar(force){
  const sb = document.querySelector('.sidebar');
  const ov = document.querySelector('.sidebar-overlay');
  if(!sb || !ov) return;
  const open = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}
const sidebarEl = document.querySelector('.sidebar');
if(sidebarEl){
  sidebarEl.addEventListener('click', e=>{
    if(e.target.closest('.nav-item') && window.innerWidth <= 768){
      toggleSidebar(false);
    }
  });
}

/* ====== Modal ====== */
function openModal(id){
  document.getElementById('modal-mask').classList.add('show');
  if(id){
    const l = links.find(x=>x.id===id);
    document.getElementById('modal-title').textContent = '编辑地址';
    document.getElementById('link-id').value = l.id;
    document.getElementById('link-name').value = l.name||'';
    document.getElementById('link-url').value = l.url||'';
    document.getElementById('link-tags').value = l.tags||'';
    document.getElementById('link-user').value = l.user||'';
    document.getElementById('link-pass').value = l.pass||'';
    document.getElementById('link-desc').value = l.desc||'';
    editingType = l.type || 'website';
  } else {
    document.getElementById('modal-title').textContent = '添加地址';
    document.getElementById('link-form').reset();
    document.getElementById('link-id').value = '';
    editingType = 'website';
  }
  syncTypePicker();
  setTimeout(()=>document.getElementById('link-name').focus(),50);
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('show');
}
document.getElementById('modal-mask').addEventListener('click', e=>{
  if(e.target.id === 'modal-mask') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeModal();
});

/* type picker */
document.getElementById('type-picker').addEventListener('click', e=>{
  if(e.target.classList.contains('type-opt')){
    editingType = e.target.dataset.type;
    syncTypePicker();
  }
});
function syncTypePicker(){
  document.querySelectorAll('.type-opt').forEach(o=>{
    o.classList.toggle('active', o.dataset.type === editingType);
  });
}

/* ====== CRUD ====== */
function saveLink(e){
  e.preventDefault();
  const id = document.getElementById('link-id').value;
  const data = {
    name: document.getElementById('link-name').value.trim(),
    url: document.getElementById('link-url').value.trim(),
    type: editingType,
    tags: document.getElementById('link-tags').value.trim(),
    user: document.getElementById('link-user').value.trim(),
    pass: document.getElementById('link-pass').value.trim(),
    desc: document.getElementById('link-desc').value.trim(),
  };
  if(!data.name || !data.url){
    toast('请填写名称和网址');
    return false;
  }
  if(id){
    const idx = links.findIndex(l=>l.id===id);
    links[idx] = {...links[idx], ...data, updatedAt: Date.now()};
    toast('已更新');
  } else {
    links.unshift({...data, id:genId(), starred:false, createdAt:Date.now(), updatedAt:Date.now()});
    toast('已添加');
  }
  saveData();
  closeModal();
  render();
  return false;
}

function editLink(id){ openModal(id); }

function deleteLink(id){
  const l = links.find(x=>x.id===id);
  if(!l) return;
  if(!confirm(`确定删除「${l.name}」吗？此操作不可撤销。`)) return;
  links = links.filter(x=>x.id!==id);
  saveData();
  render();
  toast('已删除');
}

function toggleStar(id){
  const l = links.find(x=>x.id===id);
  l.starred = !l.starred;
  saveData();
  render();
  toast(l.starred ? '已收藏 ★' : '已取消收藏');
}

function copyUrl(id){
  const l = links.find(x=>x.id===id);
  navigator.clipboard.writeText(normalizeUrl(l.url)).then(()=>{
    toast('网址已复制');
  }).catch(()=>toast('复制失败'));
}

function copyCreds(id){
  const l = links.find(x=>x.id===id);
  const text = (l.user ? `账号：${l.user}\n` : '') + (l.pass ? `密码：${l.pass}` : '');
  navigator.clipboard.writeText(text).then(()=>{
    toast('账号信息已复制');
  }).catch(()=>toast('复制失败'));
}

/* ====== Import / Export ====== */
function exportData(){
  if(links.length === 0){ toast('暂无数据可导出'); return; }
  const blob = new Blob([JSON.stringify(links, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `linkvault-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 ' + links.length + ' 条');
}

document.getElementById('import-file').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      let added = 0;
      data.forEach(item=>{
        if(item.name && item.url){
          links.unshift({
            id:genId(),
            name:item.name, url:item.url,
            type:item.type||'other',
            tags:item.tags||'', user:item.user||'', pass:item.pass||'', desc:item.desc||'',
            starred:item.starred||false,
            createdAt:item.createdAt||Date.now(),
            updatedAt:Date.now()
          });
          added++;
        }
      });
      saveData();
      render();
      toast(`已导入 ${added} 条`);
    }catch(err){
      toast('导入失败：文件格式不正确');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function clearAllData(){
  if(links.length === 0){ toast('没有数据可清空'); return; }
  if(!confirm(`⚠️ 确定清空全部 ${links.length} 条地址吗？\n\n此操作不可撤销，建议先导出备份。`)) return;
  if(!confirm('再次确认：真的要全部删除吗？')) return;
  links = [];
  saveData();
  render();
  toast('已清空全部数据');
}

/* ====== Toast ====== */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ====== Seed sample data (first run) ====== */
function seedIfEmpty(){
  if(localStorage.getItem(STORAGE_KEY)) return;
  const now = Date.now();
  links = [
    {id:genId(), name:'GitHub', url:'https://github.com', type:'website', tags:'开发,代码托管', user:'', pass:'', desc:'全球最大代码托管平台', starred:true, createdAt:now-86400000, updatedAt:now-86400000},
    {id:genId(), name:'MDN Web Docs', url:'https://developer.mozilla.org', type:'website', tags:'文档,前端', user:'', pass:'', desc:'Web 开发权威文档', starred:false, createdAt:now-172800000, updatedAt:now-172800000},
    {id:genId(), name:'OpenAI API', url:'https://api.openai.com/v1', type:'api', tags:'AI,接口', user:'sk-xxx', pass:'', desc:'大模型接口端点', starred:true, createdAt:now-259200000, updatedAt:now-3600000},
    {id:genId(), name:'生产服务器', url:'192.168.1.100', type:'server', tags:'生产环境,SSH', user:'root', pass:'••••••', desc:'主应用服务器，Ubuntu 22.04', starred:false, createdAt:now-345600000, updatedAt:now-345600000},
  ];
  saveData();
}

/* ====== Init ====== */
seedIfEmpty();
loadData();
render();
</script>
</body>
</html>
