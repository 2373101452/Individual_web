<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>功能菜单 | MH Exclusive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23e78dff'/%3E%3Cstop offset='100%25' style='stop-color:%23f4e44f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='26' r='4' fill='%23fff'/%3E%3Ccircle cx='42' cy='26' r='4' fill='%23fff'/%3E%3Cpath d='M22 40 Q32 50 42 40' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf3ea;
  --surface:#fffdf9;
  --surface-2:#f6ecdd;
  --border:#efe1cf;
  --text:#4b3a2c;
  --text-muted:#a08a73;
  --brand:#e08a5b;
  --brand-d:#c9734a;
  --brand-soft:#fbe6d6;
  --accent:#f3b25f;
  --shadow-sm:0 2px 10px rgba(190,140,95,.10);
  --shadow:0 16px 38px rgba(190,140,95,.16);
  --radius:22px;
  --radius-l:30px;
  --radius-pill:999px;
  --grad:linear-gradient(135deg,#e78dff,#f4e44f);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1100px 560px at 100% -12%, #fdeede 0%, transparent 55%),
    radial-gradient(820px 480px at -12% 112%, #fbe5d4 0%, 48%, transparent 70%),
    var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--brand-soft)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#e5cdb4;border-radius:999px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ====== 顶部栏 ====== */
.app-header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;padding:0 24px;
  background:rgba(255,253,249,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.brand{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;color:inherit;
  padding:6px 12px;margin-left:-12px;border-radius:var(--radius-pill);
  transition:background .16s;
}
.brand:hover{background:var(--brand-soft)}
.brand-logo{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#d9d8c0,#ced4b8);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 8px 16px rgba(224,138,91,.35);
}
.brand-name{font-size:17px;font-weight:800;line-height:1.25}
.brand-sub{font-size:11px;color:var(--text-muted);letter-spacing:1px}
.header-back{
  display:flex;align-items:center;gap:6px;
  height:38px;padding:0 16px;border-radius:var(--radius-pill);
  background:var(--surface-2);color:var(--brand-d);
  font-size:13px;font-weight:700;text-decoration:none;
  transition:.16s;
}
.header-back:hover{background:var(--brand-soft);transform:translateY(-1px)}

/* ====== 菜单 ====== */
.menu-wrap{max-width:720px;margin:0 auto;padding:48px 20px 64px}
.menu-hero{text-align:center;margin-bottom:36px}
.menu-badge{
  display:inline-block;padding:6px 14px;margin-bottom:16px;
  border-radius:var(--radius-pill);
  background:var(--brand-soft);color:var(--brand-d);
  font-size:12px;font-weight:700;letter-spacing:1px;
}
.menu-hero h1{font-size:30px;font-weight:800;letter-spacing:.5px}
.menu-hero p{margin-top:10px;color:var(--text-muted);font-size:14px}

.menu-list{
  display:flex;flex-direction:column;gap:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-l);
  padding:14px;
  box-shadow:var(--shadow);
}
.menu-item{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:var(--radius);
  background:var(--surface);color:inherit;text-decoration:none;
  border:1px solid transparent;
  transition:.18s;
}
.menu-item:hover{
  background:var(--surface-2);
  border-color:var(--border);
  transform:translateX(4px);
  box-shadow:var(--shadow-sm);
}
.menu-icon{
  width:46px;height:46px;flex-shrink:0;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f7cfa8,#f3b25f);
  color:#fff;font-size:18px;font-weight:800;
  box-shadow:0 8px 16px rgba(224,138,91,.28);
}
.menu-icon.magnet{background:linear-gradient(135deg,#e78dff,#f4e44f)}
.menu-text{flex:1;min-width:0;display:flex;flex-direction:column}
.menu-title{font-size:16px;font-weight:700}
.menu-desc{font-size:12.5px;color:var(--text-muted)}
.menu-arrow{
  color:var(--text-muted);font-size:18px;flex-shrink:0;
  transition:.18s;
}
.menu-item:hover .menu-arrow{color:var(--brand-d);transform:translateX(3px)}
.menu-foot{text-align:center;margin-top:26px;font-size:12px;color:var(--text-muted)}

@media (max-width:600px){
  .app-header{padding:0 16px}
  .brand-name{font-size:15px}
  .header-back{padding:0 12px;font-size:12px}
  .menu-wrap{padding:32px 14px 48px}
  .menu-hero h1{font-size:24px}
  .menu-item{padding:14px}
}
</style>
</head>
<body>

<header class="app-header">
  <a class="brand" href="../index.html" title="返回网址管理">
    <div class="brand-logo">R</div>
    <div>
      <div class="brand-name">MH Exclusive</div>
      <div class="brand-sub">功能菜单</div>
    </div>
  </a>
  <a class="header-back" href="../index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回网址管理
  </a>
</header>

<main class="menu-wrap">
  <div class="menu-hero">
    <div class="menu-badge">MENU</div>
    <h1>功能菜单</h1>
    <p>选择一个功能进入，后续新功能都会加在这里。</p>
  </div>

  <nav class="menu-list">
    <a class="menu-item" href="cl.html">
      <span class="menu-icon magnet">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v10a6 6 0 0 0 12 0V3"/><path d="M6 8h4M14 8h4"/></svg>
      </span>
      <span class="menu-text">
        <span class="menu-title">磁力播放器</span>
        <span class="menu-desc">WebTorrent 本地磁力链接播放</span>
      </span>
      <span class="menu-arrow">→</span>
    </a>
  </nav>

  <div class="menu-foot">所有数据均存储于本地浏览器</div>
</main>

</body>
</html>
